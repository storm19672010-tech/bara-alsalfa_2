<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<title>برّا السالفة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080d; --panel:#121724; --panel2:#1a2133; --line:rgba(255,255,255,.09);
  --text:#eef1f8; --muted:#8f99b3; --amber:#ffb627; --amber2:#ff8a1f;
  --red:#ff4d6d; --green:#35e0a1; --violet:#8b7bff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;
  font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;font-size:16px;line-height:1.5;
  overflow-x:hidden;
}
h1,h2,h3,.cairo{font-family:'Cairo','Tajawal',sans-serif;margin:0}
button{font-family:inherit;color:inherit}
body::before{
  content:"";position:fixed;inset:0;z-index:-3;
  background:
    radial-gradient(60% 38% at 50% -6%,rgba(255,182,39,.24),transparent 70%),
    radial-gradient(45% 30% at 95% 105%,rgba(139,123,255,.16),transparent 70%),
    radial-gradient(40% 30% at 0% 85%,rgba(255,77,109,.11),transparent 70%),
    var(--bg);
}
.beam{
  position:fixed;top:-12vh;left:50%;width:130vw;max-width:980px;height:78vh;z-index:-2;pointer-events:none;
  transform:translateX(-50%);background:linear-gradient(to bottom,rgba(255,214,120,.17),transparent 88%);
  clip-path:polygon(43% 0,57% 0,100% 100%,0 100%);filter:blur(5px);animation:sway 10s ease-in-out infinite alternate;
}
@keyframes sway{from{transform:translateX(-53%)}to{transform:translateX(-47%)}}
.qmarks{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.qmarks span{
  position:absolute;font-family:'Cairo',sans-serif;font-weight:900;color:rgba(255,255,255,.045);
  animation:floaty 14s ease-in-out infinite alternate;
}
@keyframes floaty{from{transform:translateY(0) rotate(-8deg)}to{transform:translateY(-26px) rotate(8deg)}}

#app{max-width:560px;margin:0 auto;padding:14px 16px calc(28px + env(safe-area-inset-bottom))}
.screen{display:flex;flex-direction:column;gap:14px}
#app.enter .screen{animation:rise .38s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- العناصر ---------- */
.card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015)),var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px}
.card h3{font-size:17px;margin-bottom:10px;font-weight:800}
.muted{color:var(--muted)}
.center{text-align:center}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1}
.wrap{flex-wrap:wrap}

.btn{
  appearance:none;border:1px solid var(--line);background:var(--panel2);border-radius:16px;
  padding:16px 20px;font-size:19px;font-weight:700;cursor:pointer;min-height:58px;
  transition:transform .12s,filter .15s,background .15s,opacity .15s;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}
.btn.primary{background:linear-gradient(135deg,var(--amber),var(--amber2));color:#1d1300;border:none;font-family:'Cairo',sans-serif;font-weight:900;font-size:20px;box-shadow:0 8px 28px rgba(255,150,30,.28)}
.btn.danger{background:rgba(255,77,109,.14);border-color:rgba(255,77,109,.5);color:#ffb3c0}
.btn.green{background:rgba(53,224,161,.14);border-color:rgba(53,224,161,.5);color:#9af2cf}
.btn.ghost{background:transparent}
.btn.sm{min-height:48px;padding:10px 16px;font-size:17px;border-radius:12px;width:auto}
.btn.xs{min-height:44px;padding:6px 14px;font-size:18px;border-radius:10px;width:auto}

input{
  width:100%;background:#0b0e17;border:1.5px solid var(--line);border-radius:14px;color:var(--text);
  padding:14px 16px;font-size:18px;font-family:inherit;outline:none;text-align:center;
}
input:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,182,39,.15)}
input::placeholder{color:#59627a}
label.l{display:block;font-size:14px;color:var(--muted);margin:0 4px 6px}

.av{
  --c:#ffb627;display:inline-flex;align-items:center;justify-content:center;flex:none;
  width:48px;height:48px;border-radius:50%;font-family:'Cairo',sans-serif;font-weight:900;font-size:21px;
  color:#10131c;background:var(--c);box-shadow:0 0 0 2px rgba(0,0,0,.35) inset,0 4px 14px color-mix(in srgb,var(--c) 40%,transparent);
}
.av.lg{width:78px;height:78px;font-size:34px}
.av.xl{width:104px;height:104px;font-size:46px}
.av.sm{width:36px;height:36px;font-size:17px}

.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:16px;font-weight:700}
.pill.amber{background:rgba(255,182,39,.13);border-color:rgba(255,182,39,.4);color:var(--amber)}
.pill.red{background:rgba(255,77,109,.13);border-color:rgba(255,77,109,.4);color:#ff9fb2}
.pill.green{background:rgba(53,224,161,.12);border-color:rgba(53,224,161,.4);color:#8cf0c8}

/* ---------- الصفحة الرئيسية ---------- */
.hero{text-align:center;padding:34px 0 8px}
.mark{
  width:128px;height:128px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;
  font-family:'Cairo',sans-serif;font-weight:900;font-size:84px;color:var(--amber);line-height:1;
  background:radial-gradient(circle at 50% 35%,rgba(255,182,39,.28),rgba(255,182,39,.04) 70%);
  border:2px solid rgba(255,182,39,.45);box-shadow:0 0 60px rgba(255,170,30,.3),inset 0 0 30px rgba(255,170,30,.15);
  animation:pulse 3.4s ease-in-out infinite;
}
@keyframes pulse{50%{box-shadow:0 0 90px rgba(255,170,30,.5),inset 0 0 40px rgba(255,170,30,.22)}}
.hero h1{font-size:46px;font-weight:900;letter-spacing:-.5px;background:linear-gradient(180deg,#fff,#ffd98a);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);margin:8px auto 0;max-width:340px;font-size:16px}
.stack{display:flex;flex-direction:column;gap:12px}

/* ---------- الشريط العلوي ---------- */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;padding-top:6px}
.topbar .title{font-family:'Cairo',sans-serif;font-weight:900;font-size:24px;color:var(--amber);margin-inline-end:auto}
.iconbtn{
  appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.05);width:56px;height:56px;border-radius:16px;
  font-size:28px;line-height:1;cursor:pointer;display:grid;place-items:center;
}
.iconbtn:active{transform:scale(.93)}

/* ---------- الغرفة ---------- */
.codeboxes{display:flex;gap:8px;justify-content:center;direction:ltr;margin:6px 0 14px}
.codeboxes b{
  width:52px;height:64px;display:grid;place-items:center;border-radius:14px;font-family:'Cairo',sans-serif;font-size:34px;font-weight:900;
  background:#0b0e17;border:1.5px solid rgba(255,182,39,.45);color:var(--amber);box-shadow:0 0 20px rgba(255,182,39,.12) inset;
}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid transparent}
.prow.me{border-color:rgba(255,182,39,.35);background:rgba(255,182,39,.06)}
.prow .nm{font-weight:700;font-size:19px}
.prow.off{opacity:.5}
.topics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.topic{
  appearance:none;cursor:pointer;border-radius:16px;border:1.5px solid var(--line);background:var(--panel2);
  padding:16px 4px;text-align:center;font-weight:700;font-size:16px;display:flex;flex-direction:column;gap:4px;align-items:center;transition:.15s;
}
.topic .ic{font-size:44px;line-height:1.2}
.topic.sel{border-color:var(--amber);background:rgba(255,182,39,.14);box-shadow:0 0 0 3px rgba(255,182,39,.14);color:#ffe2a0}
.notice{background:rgba(255,77,109,.12);border:1px solid rgba(255,77,109,.4);color:#ffc0cb;border-radius:14px;padding:12px 14px;font-size:15px}

/* ---------- بطاقة الدور ---------- */
.flip{perspective:1100px;height:310px;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;border-radius:26px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;border:1.5px solid var(--line);
}
.face.front{
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.025) 0 12px,transparent 12px 24px),linear-gradient(160deg,#1b2236,#0f1320);
  border-color:rgba(255,182,39,.4);
}
.face.front .q{font-family:'Cairo',sans-serif;font-weight:900;font-size:110px;line-height:1;color:var(--amber);text-shadow:0 0 40px rgba(255,170,30,.6)}
.face.back{transform:rotateY(180deg)}
.face.in{background:linear-gradient(160deg,#0f2a25,#0b1613);border-color:rgba(53,224,161,.55);box-shadow:0 0 50px rgba(53,224,161,.18)}
.face.out{background:linear-gradient(160deg,#33101a,#15080c);border-color:rgba(255,77,109,.6);box-shadow:0 0 50px rgba(255,77,109,.22)}
.role-tag{font-family:'Cairo',sans-serif;font-weight:900;font-size:26px}
.face.in .role-tag{color:var(--green)} .face.out .role-tag{color:var(--red)}
.theword{font-family:'Cairo',sans-serif;font-weight:900;font-size:clamp(40px,13vw,64px);line-height:1.15;color:#fff;text-shadow:0 0 30px rgba(53,224,161,.5);word-break:break-word}
.big-out{font-size:96px;line-height:1}

/* ---------- الأسئلة ---------- */
.duel{display:flex;align-items:stretch;justify-content:center;gap:6px}
.who{
  flex:1;min-width:0;background:var(--panel2);border:1.5px solid var(--line);border-radius:20px;padding:16px 6px;
  display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
}
.who b{font-family:'Cairo',sans-serif;font-size:19px;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.who small{color:var(--muted);font-weight:700}
.who.asker{border-color:rgba(255,182,39,.55);background:rgba(255,182,39,.07)}
.who.asked{border-color:rgba(139,123,255,.55);background:rgba(139,123,255,.08)}
.who.meh{box-shadow:0 0 0 3px rgba(255,255,255,.14)}
.arrow{display:grid;place-items:center;font-size:34px;color:var(--amber);padding:0 2px}
.yours{background:linear-gradient(135deg,rgba(255,182,39,.2),rgba(255,138,31,.1));border:1px solid rgba(255,182,39,.5);border-radius:16px;padding:12px 14px;font-weight:700;text-align:center}
.chain{display:flex;flex-wrap:wrap;gap:6px}
.step{font-size:13.5px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.step.done{opacity:.45;text-decoration:line-through}
.step.cur{background:rgba(255,182,39,.16);border-color:var(--amber);color:#ffe2a0;font-weight:800}


/* ---------- التصويت ---------- */
.vgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.vcard{
  appearance:none;cursor:pointer;background:var(--panel2);border:1.5px solid var(--line);border-radius:20px;padding:20px 8px;
  display:flex;flex-direction:column;align-items:center;gap:8px;transition:.15s;font-family:'Cairo',sans-serif;font-weight:800;font-size:18px;min-width:0;
}
.vcard span.n{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vcard:active{transform:scale(.96)}
.vcard.sel{border-color:var(--red);background:rgba(255,77,109,.14);box-shadow:0 0 0 3px rgba(255,77,109,.18)}
.vcard:disabled{cursor:default;opacity:.55}
.vcard.sel:disabled{opacity:1}

/* ---------- الكشف ---------- */
.reveal{text-align:center;padding:22px 14px;border-radius:24px;background:linear-gradient(160deg,#33101a,#12070b);border:1.5px solid rgba(255,77,109,.6);box-shadow:0 0 60px rgba(255,77,109,.22);animation:pop .7s cubic-bezier(.2,1.3,.3,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.reveal .lbl{color:#ffb3c0;font-weight:700}
.reveal .who-n{font-family:'Cairo',sans-serif;font-weight:900;font-size:40px;color:#fff;margin:8px 0 0}
.vlist{display:flex;flex-direction:column;gap:6px}
.vl{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.035);font-size:15.5px}
.vl .arr{color:var(--muted)}
.vl .res{margin-inline-start:auto;font-weight:800}
.vl.good{background:rgba(53,224,161,.08)} .vl.good .res{color:var(--green)}
.vl.bad .res{color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.opt{
  appearance:none;cursor:pointer;background:var(--panel2);border:1.5px solid var(--line);border-radius:16px;padding:16px 8px;font-family:'Cairo',sans-serif;font-weight:800;font-size:19px;min-height:62px;transition:.12s;
}
.opt:active{transform:scale(.95);border-color:var(--amber);background:rgba(255,182,39,.12)}

/* ---------- النتائج ---------- */
.wordbox{text-align:center;padding:18px 12px;border-radius:22px;background:linear-gradient(160deg,#0f2a25,#0b1613);border:1.5px solid rgba(53,224,161,.5)}
.wordbox .w{font-family:'Cairo',sans-serif;font-weight:900;font-size:44px;line-height:1.2}
.srow{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid transparent}
.srow.me{border-color:rgba(255,182,39,.4);background:rgba(255,182,39,.07)}
.srow.first{background:linear-gradient(135deg,rgba(255,182,39,.18),rgba(255,138,31,.06));border-color:rgba(255,182,39,.55)}
.rank{width:42px;text-align:center;font-family:'Cairo',sans-serif;font-weight:900;font-size:28px;flex:none}
.sinfo{flex:1;min-width:0}
.sinfo .nm{font-weight:800;font-size:17px;display:flex;align-items:center;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.07)}
.chip.p{background:rgba(53,224,161,.14);color:#8cf0c8}
.chip.n{background:rgba(255,77,109,.15);color:#ffa3b4}
.total{font-family:'Cairo',sans-serif;font-weight:900;font-size:26px;direction:ltr;min-width:56px;text-align:left}
.total small{display:block;font-size:13px;font-weight:800;color:var(--green)}
.total small.neg{color:var(--red)}

/* ---------- نوافذ ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(3,4,8,.72);backdrop-filter:blur(4px);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{
  width:100%;max-width:560px;max-height:88dvh;overflow:auto;background:#0f1320;border:1px solid var(--line);border-bottom:none;
  border-radius:26px 26px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));animation:slide .28s cubic-bezier(.2,.8,.2,1);
}
@keyframes slide{from{transform:translateY(40px);opacity:0}}
.sheet h2{font-size:23px;font-weight:900;margin-bottom:12px;color:var(--amber)}
.sheet h4{font-family:'Cairo',sans-serif;font-size:16.5px;color:#ffe2a0;margin:16px 0 6px}
.sheet p,.sheet li{color:#cdd3e4;font-size:15.5px;margin:4px 0}
.sheet ol,.sheet ul{padding-inline-start:22px;margin:6px 0}
.pen{border:1.5px solid rgba(255,77,109,.55)}
.pen .vs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.toast{
  position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(30px);z-index:80;
  background:#1c2336;border:1px solid rgba(255,182,39,.5);color:#fff;padding:12px 18px;border-radius:16px;font-weight:700;max-width:90vw;text-align:center;
  opacity:0;pointer-events:none;transition:.3s;box-shadow:0 10px 40px rgba(0,0,0,.5);
}
.toast.show{opacity:1;transform:translateX(-50%)}
.conn{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:90;background:#3a1d24;border:1px solid var(--red);padding:4px 14px;border-radius:99px;font-size:13px;font-weight:700}
.hide{display:none!important}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dot{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 7px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:16px;font-weight:700}
.dot.y{border-color:rgba(53,224,161,.5);color:#8cf0c8}
.dot.n{border-color:rgba(255,77,109,.5);color:#ffa3b4}
.sep{height:1px;background:var(--line);margin:4px 0}
@media (max-width:380px){.hero h1{font-size:38px}.codeboxes b{width:44px;height:56px;font-size:28px}.iconbtn{width:48px;height:48px;font-size:24px}.topic .ic{font-size:38px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="beam"></div>
<div class="qmarks" aria-hidden="true">
  <span style="top:12%;right:8%;font-size:70px">؟</span>
  <span style="top:30%;left:6%;font-size:110px;animation-delay:-4s">؟</span>
  <span style="top:58%;right:12%;font-size:90px;animation-delay:-7s">؟</span>
  <span style="top:78%;left:14%;font-size:64px;animation-delay:-2s">؟</span>
  <span style="top:44%;right:46%;font-size:50px;animation-delay:-9s">؟</span>
</div>
<div id="conn" class="conn hide">جاري إعادة الاتصال…</div>
<main id="app"></main>
<div id="overlay"></div>
<div id="toast" class="toast"></div>

<script>
'use strict';
/* ====== حالة التطبيق المحلية ====== */
let S = null;               // آخر حالة من السيرفر
let session = null;         // {code,pid,token}
let es = null;
let homeView = 'home';      // home | create | join
let selTopic = null;
let cardShown = false, cardOpen = false, rulesOpen = false, pickerOpen = false;
let lastToast = null, lastKey = '', lastTurnKey = '', unloading = false;
window.addEventListener('pagehide', () => { unloading = true; });
window.addEventListener('beforeunload', () => { unloading = true; });
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const COLORS = ['#ffb627', '#ff6b8b', '#35e0a1', '#8b7bff', '#38bdf8', '#fb923c', '#e879f9', '#a3e635', '#2dd4bf', '#f472b6', '#facc15', '#60a5fa'];
function colorOf(name) { let h = 7; for (const ch of String(name)) h = (h * 31 + ch.codePointAt(0)) >>> 0; return COLORS[h % COLORS.length]; }
const P = (id) => (S && S.players.find((p) => p.id === id)) || null;
const nameOf = (id) => (P(id) ? P(id).name : 'لاعب غادر');
function av(id, size) {
  const p = P(id); const n = p ? p.name : '?';
  return `<span class="av ${size || ''}" style="--c:${colorOf(n)}">${esc([...n][0] || '?')}</span>`;
}
const isHost = () => S && S.hostId === S.me;

/* ====== اتصال ====== */
async function post(path, body) {
  try {
    const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    return await r.json();
  } catch (e) { return { error: 'ما في اتصال بالسيرفر' }; }
}
async function act(type, extra) {
  if (!session) return;
  const j = await post('/api/action', Object.assign({}, session, { type }, extra || {}));
  if (j.error) toast(j.error);
  return j;
}
function saveSession(s) { session = s; try { sessionStorage.setItem('bara_session', JSON.stringify(s)); } catch (e) { /* */ } }
function clearSession() { session = null; S = null; try { sessionStorage.removeItem('bara_session'); } catch (e) { /* */ } if (es) { es.close(); es = null; } }
function connect() {
  if (es) es.close();
  es = new EventSource(`/api/events?room=${encodeURIComponent(session.code)}&pid=${session.pid}&token=${session.token}`);
  es.onopen = () => $('#conn').classList.add('hide');
  es.onmessage = (e) => {
    $('#conn').classList.add('hide');
    const first = S === null;
    S = JSON.parse(e.data);
    if (first) { lastToast = S.toast ? S.toast.id : null; lastKey = ''; }
    if (S.toast && S.toast.id !== lastToast) { lastToast = S.toast.id; toast(S.toast.text); }
    handleTurnBuzz();
    render();
  };
  es.addEventListener('kicked', () => { clearSession(); homeView = 'home'; render(); toast('المضيف طلّعك من الغرفة'); });
  es.onerror = async () => {
    if (unloading) return;
    $('#conn').classList.remove('hide');
    if (es && es.readyState === 2) {
      // المتصفح وقّف المحاولات: نتأكد من السيرفر هل الغرفة/الجلسة لسا موجودة
      const mine = session;
      const j = await post('/api/ping', mine || {});
      if (!session || session !== mine) return;
      if (j.error && (j.status === 404 || j.status === 401 || /ما لقينا|انتهت/.test(j.error))) {
        clearSession(); homeView = 'home'; render(); toast('انتهت الغرفة أو الجلسة');
      } else { setTimeout(() => { if (session === mine && !unloading) connect(); }, 2000); }
    }
  };
}
function handleTurnBuzz() {
  const g = S.game;
  if (S.phase !== 'questions' || !g || !g.turns) { lastTurnKey = ''; return; }
  const key = S.roundNo + ':' + g.turnIdx;
  if (key !== lastTurnKey) {
    lastTurnKey = key;
    const t = g.turns[g.turnIdx];
    if (t && t.from === S.me && navigator.vibrate) navigator.vibrate([120, 60, 120]);
  }
}

function toast(msg) {

}
async function copyText(txt, okMsg) {

  catch (e) { const a = document.createElement('textarea'); a.value = txt; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); } catch (_) { /* */ } a.remove(); }
  toast(okMsg);
}

/* ---- النتائج ---- */
function scoresHTML() {
  const g = S.game;
  const bd = {}; (g.breakdown || []).forEach((b) => { bd[b.id] = b; });
  const sorted = S.players.slice().sort((a, b) => b.score - a.score);
  const medals = ['🥇', '🥈', '🥉'];
  const rows = sorted.map((p, i) => {
    const b = bd[p.id]; const chips = [];
    if (b) {
      if (p.id === g.outsiderId) chips.push('<span class="chip">🕵️ كان برا السالفة</span>');
      if (b.voteCorrect) chips.push(`<span class="chip p">+${S.cfg.correct} كشفه</span>`);
      if (b.guessCorrect) chips.push(`<span class="chip p">+${S.cfg.correct} خمّن السالفة</span>`);
      if (b.penalties) chips.push(`<span class="chip n">−${b.penalties * S.cfg.penaltyPoints} سؤال كاشف</span>`);
      if (!chips.length || (p.id === g.outsiderId && chips.length === 1)) { if (!b.voteCorrect && !b.guessCorrect && !b.penalties) chips.push('<span class="chip">بدون نقاط</span>'); }
    }
    const d = b ? b.delta : 0;
    return `<div class="srow ${p.id === S.me ? 'me' : ''} ${i === 0 ? 'first' : ''}">
      <span class="rank">${medals[i] || i + 1}</span>${av(p.id)}
      <div class="sinfo"><div class="nm">${esc(p.name)}${p.ready ? ' <span class="pill green" style="padding:1px 8px;font-size:12px">جاهز</span>' : ''}</div><div class="chips">${chips.join('')}</div></div>
      <div class="total">${p.score}${b ? `<small class="${d < 0 ? 'neg' : ''}">${d >= 0 ? '+' : ''}${d}</small>` : ''}</div></div>`;
  }).join('');
  const gs = g.guess;
  const me = P(S.me);
  const readyCount = S.players.filter((p) => p.ready).length;
  return `<section class="screen">
    <div class="wordbox"><div class="muted" style="font-weight:700">السالفة كانت</div><div class="w">${esc(g.word)}</div><div class="pill" style="margin-top:6px">${g.topic.icon} ${esc(g.topic.name)}</div></div>
    <div class="card center" style="padding:12px"><b>${esc(nameOf(g.outsiderId))}</b> ${gs.timedOut ? 'ما خمّن السالفة ⏭️' : gs.correct ? `خمّن السالفة صح 🎯` : `خمّن غلط ❌ (اختار: ${esc(gs.picked)})`}</div>

    <button class="btn ghost danger" data-act="leave">🚪 خروج من الغرفة</button>
  </section>`;
}

/* ---- نوافذ ---- */
function penaltySheet() {
  if (!S || !S.game || !S.game.penalty || !S.game.penalty.active) return '';
  const a = S.game.penalty.active;
  const isTarget = a.targetId === S.me;
  const vs = a.voters.map((id) => {
    const v = a.votes[id];
    return `<span class="dot ${v === true ? 'y' : v === false ? 'n' : ''}">${av(id, 'sm')}${esc(nameOf(id))} ${v === true ? '✓' : v === false ? '✗' : '…'}</span>`;
  }).join('');
  return `<div class="sheet-bg" style="align-items:flex-end"><div class="sheet pen">
    <h2 style="color:#ff9fb2">🚩 تصويت خصم</h2>
    <p style="font-size:17px"><b>${esc(nameOf(a.proposerId))}</b> يقول إن سؤال <b>${esc(nameOf(a.targetId))}</b> كشف السالفة.<br>نخصم <b>${S.cfg.penaltyPoints}</b> نقاط من ${esc(nameOf(a.targetId))}؟ <span class="muted">(لازم الكل يوافق)</span></p>
    <div class="vs">${vs}</div>
    ${a.canVote ? `<div class="row"><button class="btn green" data-act="pen-yes">👍 موافق</button><button class="btn danger" data-act="pen-no">👎 ارفض</button></div>`
      : `<div class="center muted">${isTarget ? 'اللاعبين عم يصوتوا على خصم منك…' : 'تم تصويتك، ننتظر الباقي…'}</div>`}
    ${isHost() ? `<button class="btn ghost sm" style="margin:14px auto 0" data-act="pen-cancel">إلغاء التصويت (كمضيف)</button>` : ''}
  </div></div>`;
}

function overlays() {
  let h = '';
  if (pickerOpen && S && S.game && S.game.participants) {
    const g = S.game; const cur = g.turns && g.turns[g.turnIdx];
    const list = g.participants.filter((id) => id !== S.me).map((id) => `<button class="vcard" style="flex-direction:row;justify-content:flex-start;padding:10px 14px;gap:12px;width:100%" data-act="propose" data-id="${id}">${av(id)}<span class="n">${esc(nameOf(id))}</span>${cur && cur.from === id ? '<span class="pill amber" style="margin-inline-start:auto">يسأل الحين</span>' : ''}</button>`).join('');
    h += `<div class="sheet-bg" data-act="picker-close"><div class="sheet" data-stop="1"><h2>🚩 مين سؤاله كشف السالفة؟</h2><p class="muted">بيصير تصويت لكل اللاعبين. إذا وافقوا كلهم تنخصم ${S.cfg.penaltyPoints} نقاط من نقاطه بنهاية الجولة.</p><div class="stack" style="gap:8px;margin-top:10px">${list}</div><button class="btn ghost" style="margin-top:12px" data-act="picker-close">إلغاء</button></div></div>`;
  }
  if (cardOpen && S && S.game && S.game.role) {
    const g = S.game;
    h += `<div class="sheet-bg" data-act="card-close"><div class="sheet" data-stop="1" style="text-align:center">
      ${g.role === 'in' ? `<div class="role-tag" style="color:var(--green)">✅ أنت جوا السالفة</div><div class="muted" style="margin-top:6px">السالفة:</div><div class="theword" style="margin:10px 0">${esc(g.word)}</div>`
        : `<div class="big-out">🕵️</div><div class="role-tag" style="color:var(--red)">أنت برا السالفة</div><p style="color:#ffc0cb">اندمج واكتشفها من كلامهم</p>`}
      <div class="pill">الموضوع: ${g.topic.icon} ${esc(g.topic.name)}</div>
      <button class="btn" style="margin-top:16px" data-act="card-close">إخفاء</button></div></div>`;
  }
  if (rulesOpen) h += rulesHTML();
  return h;
}

function rulesHTML() {
  return `<div class="sheet-bg" data-act="rules-close"><div class="sheet" data-stop="1">
    <h2>📜 شرح اللعبة</h2>
    <p><b>الفكرة:</b> كل اللاعبين يعرفون «السالفة» (كلمة من موضوع اختاره المضيف) <b>إلا واحد</b> هو اللي «برا السالفة». الجميع يتحدث عن السالفة بدون ما يذكرها صراحة. اللي برا يحاول يندمج ويخمّن السالفة، والباقي يحاولون يكشفونه.</p>
    <h4>طريقة اللعب</h4>
    <ol>
      <li>المضيف ينشئ غرفة ويرسل الكود (5 أرقام) أو رابط الدعوة. الباقي يدخلون كضيوف بأسمائهم. المطلوب 3 لاعبين على الأقل (حتى 12).</li>
      <li>المضيف يختار <b>الموضوع</b> ويبدأ الجولة.</li>
      <li>كل لاعب يقلب بطاقته: إذا <b>جوا السالفة</b> تظهر له السالفة، وإذا <b>برا</b> يظهر له «أنت برا السالفة». لا تورّي شاشتك لأحد!</li>
      <li><b>الأسئلة بالدور:</b> الموقع يحدد مين يسأل مين («فلان اسأل فلان»). السؤال والجواب يكونون شفهياً بينكم. اسأل عن السالفة بدون ما تقولها. <b>المضيف</b> هو اللي ينقلكم للسؤال التالي.</li>
      <li><b>الأسئلة الحرة:</b> وقت مفتوح بدون عدّاد، اسأل أي حد أي سؤال. <b>المضيف</b> يبدأ التصويت لما تخلصون.</li>
      <li><b>التصويت:</b> كل لاعب يصوّت مين برا السالفة (ما تصوّت لنفسك).</li>
      <li><b>الكشف:</b> يظهر اسم اللي برا. بعدها تظهر له خيارات من نفس الموضوع ليخمّن السالفة.</li>
      <li><b>النتائج:</b> يظهر السكور. اختر «جاهز لجولة أخرى» (السكور محفوظ) أو اخرج من الغرفة.</li>
    </ol>
    <h4>النقاط</h4>
    <ul>
      <li>صوّتت صح على اللي برا السالفة: <b>+100</b></li>
      <li>اللي برا خمّن السالفة صح: <b>+100</b></li>
      <li>سؤال كشف السالفة (بعد تصويت الجميع): <b>−10</b></li>
    </ul>
    <h4>🚩 خصم السؤال الكاشف</h4>
    <p>أثناء الأسئلة، أي لاعب يقدر يضغط «سؤال كشف السالفة؟» ويختار اللاعب اللي سؤاله وضّح السالفة زيادة عن اللزوم. يصير تصويت لكل اللاعبين (غير الملام). <b>إذا وافق الكل</b> تنخصم 10 نقاط من سكوره النهائي، وإذا رفض واحد (أو ألغاه المضيف) ما يصير شي. لكل لاعب 3 محاولات بالجولة.</p>
    <h4>نصايح</h4>
    <ul>
      <li><b>جوا السالفة:</b> لا تكون واضح كثير فتفيد اللي برا، ولا غامض كثير فيشكّون فيك.</li>
      <li><b>برا السالفة:</b> اسمع الأجوبة كويس، جاوب بإجابات عامة، وانتبه ما تتناقض.</li>
    </ul>
    <button class="btn primary" style="margin-top:14px" data-act="rules-close">فهمت، يلا نلعب</button>
  </div></div>`;
}

/* ====== الأحداث ====== */
const H = {
  'go-create': () => { homeView = 'create'; render(); setTimeout(() => { const i = $('#nm'); i && i.focus(); }, 50); },
  'go-join': () => { homeView = 'join'; render(); setTimeout(() => { const i = $('#nm'); i && i.focus(); }, 50); },
  'home': () => { homeView = 'home'; render(); },
  'create': async (_, el) => {
    const name = ($('#nm').value || '').trim(); if (!name) return toast('اكتب اسمك أول');
    el.disabled = true; const j = await post('/api/create', { name }); el.disabled = false;
    if (j.error) return toast(j.error);
    saveSession({ code: j.code, pid: j.pid, token: j.token }); S = null; connect();
  },
  'join': async (_, el) => {
    const code = ($('#cd').value || '').replace(/\D/g, ''); const name = ($('#nm').value || '').trim();
    if (code.length !== 5) return toast('الكود 5 أرقام'); if (!name) return toast('اكتب اسمك أول');
    el.disabled = true; const j = await post('/api/join', { code, name }); el.disabled = false;
    if (j.error) return toast(j.error);
    saveSession({ code: j.code, pid: j.pid, token: j.token }); S = null; connect();
  },
  'copy-code': () => copyText(S.code, 'اننسخ الكود'),
  'copy-link': () => copyText(inviteLink(), 'اننسخ رابط الدعوة'),
  'share': () => { navigator.share({ title: 'برّا السالفة', text: `تعال العب معنا! كود الغرفة: ${S.code}`, url: inviteLink() }).catch(() => {}); },
  'pick-topic': (d) => { selTopic = d.id; render(); },
  'start': () => act('start', { topicId: selTopic }),
  'kick': (d) => { if (confirm('تطرد هاللاعب؟')) act('kick', { targetId: d.id }); },
  'flip': () => { cardShown = !cardShown; const f = $('.flip'); if (f) f.classList.toggle('on', cardShown); if (cardShown && navigator.vibrate) navigator.vibrate(40); },
  'ready': () => act('ready'),
  'skip-reveal': () => act('skipReveal'),
  'next-turn': () => act('nextTurn'),
  'skip-free': () => act('skipToFree'),
  'start-vote': () => act('startVote'),
  'end-vote': () => act('endVote'),
  'skip-guess': () => act('skipGuess'),
  'pen-cancel': () => act('cancelPenalty'),
  'picker-open': () => { pickerOpen = true; render(); },
  'picker-close': () => { pickerOpen = false; render(); },
  'propose': (d) => { pickerOpen = false; render(); act('proposePenalty', { targetId: d.id }); },
  'pen-yes': () => act('penaltyVote', { agree: true }),
  'pen-no': () => act('penaltyVote', { agree: false }),
  'vote': (d) => act('vote', { targetId: d.id }),
  'guess': (d) => act('guess', { word: d.w }),
  'ready-next': () => act('readyNext'),
  'start-next': () => act('startNext'),
  'leave': async () => {
    if (!confirm('تطلع من الغرفة؟')) return;
    await act('leave'); clearSession(); homeView = 'home'; render();
  },
  'card-open': () => { cardOpen = true; render(); },
  'card-close': () => { cardOpen = false; render(); },
  'rules-open': () => { rulesOpen = true; render(); },
  'rules-close': () => { rulesOpen = false; render(); },
};
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  // الضغط داخل النافذة ما يسكّرها
  const stop = e.target.closest('[data-stop]');
  if (stop && t.contains(stop)) return;
  const fn = H[t.dataset.act];
  if (fn) fn(t.dataset, t);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !S && (homeView === 'create' || homeView === 'join')) {
    const b = document.querySelector('[data-act="create"],[data-act="join"]'); if (b) b.click();
  }
});

/* ====== الإقلاع ====== */
(function boot() {
  const urlRoom = new URLSearchParams(location.search).get('room');
  let saved = null;
  try { saved = JSON.parse(sessionStorage.getItem('bara_session') || 'null'); } catch (e) { /* */ }
  if (saved && saved.code && (!urlRoom || urlRoom === saved.code)) { session = saved; connect(); }
  else if (urlRoom) { homeView = 'join'; }
  render();
})();
</script>
</body>
</html>
